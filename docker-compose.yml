services:
  python_server:
    build:
      context: ./python_server
    container_name: crypto-analysis-python-server
    ports:
      # Dashboard + APIs. Defaults match .env.example (8080 → 8000).
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-8000}"
      - "${DATASET_PREP_DASHBOARD_HOST_PORT:-8765}:${DATASET_PREP_DASHBOARD_CONTAINER_PORT:-8765}"
    # Whole file so DISCOVER_/SWARM_/ARB_/PAPER_/READY_ knobs reach the process.
    # Listing vars one-by-one silently dropped every knob not enumerated.
    # `environment:` still wins on conflicts.
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: ${CONTAINER_PORT:-8000}
      DATA_DIR: /app/data
      CANDLE_DATA_DIR: /app/data
      DECISION_STORE_DIR: /app/store

      # --- Antigravity CLI (agy) — optional LLM deep-review ---
      # Force remote/SSH OAuth so login prints a URL (no browser in container).
      SSH_CONNECTION: "172.17.0.1 22 172.17.0.2 22"
      SSH_CLIENT: "172.17.0.1 22 22"
      AGY_MODEL: ${AGY_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # --- LLM providers (optional for paper loop) ---
      NVIDIA_KEY: ${NVIDIA_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}

      # --- Solana data ---
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}

      # --- Safety ---
      SAFETY_MIN_LIQUIDITY_USD: ${SAFETY_MIN_LIQUIDITY_USD:-5000}
      SAFETY_MAX_TOP10_PCT: ${SAFETY_MAX_TOP10_PCT:-55}
      SAFETY_MIN_POOL_AGE_MIN: ${SAFETY_MIN_POOL_AGE_MIN:-5}

      # Never enable on a shared/overnight box unless you mean it.
      LIVE_TRADING: ${LIVE_TRADING:-0}
    volumes:
      # Live code mount (dev + server). Rebuild image after requirements change.
      - ./python_server:/app
      - ./python_server/data:/app/data
      # Persist decision/paper/pipeline JSONL across recreates.
      - ./python_server/store:/app/store
      # Persists one-time agy Google Sign-In across restarts/rebuilds.
      - ./.gemini:/root/.gemini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    # Auto-start Flask — no manual `./dev-server.sh` after compose up.
    command: ["./dev-server.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; p=os.getenv('PORT','8000'); urllib.request.urlopen(f'http://127.0.0.1:{p}/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s
    stdin_open: true
    tty: true
    restart: unless-stopped

  jupyter:
    build:
      context: ./python_server
    container_name: crypto-analysis-jupyter
    profiles: ["jupyter"]
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./python_server:/app
      - ./python_server/data:/app/data
    working_dir: /app
    command:
      [
        "jupyter",
        "notebook",
        "--ip=0.0.0.0",
        "--port=8888",
        "--no-browser",
        "--allow-root",
        "--ServerApp.token=",
        "--ServerApp.password=",
        "--NotebookApp.token=",
        "--NotebookApp.password=",
      ]
    stdin_open: true
    tty: true
    restart: unless-stopped
